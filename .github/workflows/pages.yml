name: Publish Hugo blog to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Hugo 0.168.0
        run: |
          curl --fail --location --retry 3 https://github.com/gohugoio/hugo/releases/download/v0.168.0/hugo_0.168.0_linux-amd64.tar.gz -o "$RUNNER_TEMP/hugo_0.168.0_linux-amd64.tar.gz"
          curl --fail --location --retry 3 https://github.com/gohugoio/hugo/releases/download/v0.168.0/hugo_0.168.0_checksums.txt -o "$RUNNER_TEMP/checksums.txt"
          cd "$RUNNER_TEMP"
          sha256sum --check --ignore-missing checksums.txt
          tar -xzf hugo_0.168.0_linux-amd64.tar.gz hugo
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Build with Hugo
        run: hugo --gc --minify
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
